<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单总览 - 订单查询系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-decoration">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <span class="brand-name">订单查询</span>
      </div>
      <nav class="topbar-nav">
        <a href="/" class="nav-link">订单查询</a>
        <a href="/orders" class="nav-link nav-link-active">订单总览</a>
      </nav>
      <div class="user-icon" title="用户">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="page-header">
      <h1>订单总览</h1>
      <p>汇总全部订单，支持按状态、关键词筛选</p>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="filter-input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);flex-shrink:0">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="keywordInput" type="text" placeholder="搜索订单编号或客户姓名" autocomplete="off">
      </div>
      <select id="statusSelect" class="filter-select">
        <option value="">全部状态</option>
        <option value="待付款">待付款</option>
        <option value="处理中">处理中</option>
        <option value="已发货">已发货</option>
        <option value="已完成">已完成</option>
      </select>
      <button id="clearBtn" class="filter-clear-btn">重置</button>
    </div>

    <!-- Orders table card -->
    <div class="orders-card">
      <div class="orders-table-wrap">
        <table class="orders-table">
          <thead>
            <tr>
              <th>订单编号</th>
              <th>客户</th>
              <th>下单时间</th>
              <th>状态</th>
              <th>订单金额</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <tr><td colspan="5" class="table-empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination-bar">
        <span class="pagination-info" id="paginationInfo"></span>
        <div class="pagination-btns" id="paginationBtns"></div>
      </div>
    </div>
  </main>

  <script>
    const STATUS_MAP = {
      '已发货': 'status-shipped',
      '处理中': 'status-processing',
      '已完成': 'status-complete',
      '待付款': 'status-pending'
    };

    const keywordInput = document.getElementById('keywordInput');
    const statusSelect = document.getElementById('statusSelect');
    const clearBtn = document.getElementById('clearBtn');
    const tableBody = document.getElementById('ordersTableBody');
    const paginationInfo = document.getElementById('paginationInfo');
    const paginationBtns = document.getElementById('paginationBtns');

    let currentPage = 1;
    const PAGE_SIZE = 20;
    let debounceTimer = null;

    function fmtCurrency(n) {
      return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderTable(orders) {
      if (!orders.length) {
        tableBody.innerHTML = '<tr><td colspan="5" class="table-empty">未找到符合条件的订单</td></tr>';
        return;
      }
      tableBody.innerHTML = orders.map(function(o) {
        var cls = STATUS_MAP[o.status] || 'status-default';
        return '<tr>' +
          '<td class="col-id"><a href="/?q=' + encodeURIComponent(o.order_id) + '">' + o.order_id + '</a></td>' +
          '<td>' + (o.customer_name || '—') + '</td>' +
          '<td>' + (o.created_at || '—') + '</td>' +
          '<td><span class="status-badge ' + cls + '">' + o.status + '</span></td>' +
          '<td class="col-amount">' + fmtCurrency(o.total) + '</td>' +
          '</tr>';
      }).join('');
    }

    function renderPagination(total, page, pageSize) {
      var totalPages = Math.max(Math.ceil(total / pageSize), 1);
      var start = (page - 1) * pageSize + 1;
      var end = Math.min(page * pageSize, total);
      paginationInfo.textContent = '共 ' + total + ' 条，显示第 ' + start + '–' + end + ' 条';

      var btns = '';
      btns += '<button class="page-btn" id="prevBtn" ' + (page <= 1 ? 'disabled' : '') + '>‹ 上一页</button>';
      var rangeStart = Math.max(1, page - 2);
      var rangeEnd = Math.min(totalPages, page + 2);
      for (var p = rangeStart; p <= rangeEnd; p++) {
        btns += '<button class="page-btn' + (p === page ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
      }
      btns += '<button class="page-btn" id="nextBtn" ' + (page >= totalPages ? 'disabled' : '') + '>下一页 ›</button>';
      paginationBtns.innerHTML = btns;

      paginationBtns.querySelectorAll('[data-page]').forEach(function(btn) {
        btn.addEventListener('click', function() { loadPage(parseInt(btn.getAttribute('data-page'))); });
      });
      var prev = paginationBtns.querySelector('#prevBtn');
      var next = paginationBtns.querySelector('#nextBtn');
      if (prev) prev.addEventListener('click', function() { loadPage(page - 1); });
      if (next) next.addEventListener('click', function() { loadPage(page + 1); });
    }

    async function loadPage(page) {
      currentPage = page;
      var q = keywordInput.value.trim();
      var status = statusSelect.value;
      var url = '/api/orders?page=' + page + '&page_size=' + PAGE_SIZE;
      if (q) url += '&q=' + encodeURIComponent(q);
      if (status) url += '&status=' + encodeURIComponent(status);

      tableBody.innerHTML = '<tr><td colspan="5" class="table-empty">加载中…</td></tr>';
      try {
        var res = await fetch(url);
        var data = await res.json();
        if (data.success) {
          renderTable(data.data);
          renderPagination(data.total, data.page, data.page_size);
        } else {
          tableBody.innerHTML = '<tr><td colspan="5" class="table-empty">加载失败，请刷新重试</td></tr>';
        }
      } catch (e) {
        tableBody.innerHTML = '<tr><td colspan="5" class="table-empty">加载失败，请刷新重试</td></tr>';
      }
    }

    function triggerFilter() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function() { loadPage(1); }, 300);
    }

    keywordInput.addEventListener('input', triggerFilter);
    statusSelect.addEventListener('change', function() { loadPage(1); });
    clearBtn.addEventListener('click', function() {
      keywordInput.value = '';
      statusSelect.value = '';
      loadPage(1);
    });

    // Handle ?q= from index page link
    (function() {
      var params = new URLSearchParams(window.location.search);
      var q = params.get('q');
      if (q) keywordInput.value = q;
    })();

    loadPage(1);
  </script>
</body>
</html>
