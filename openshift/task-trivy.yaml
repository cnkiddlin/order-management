apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-fs
spec:
  workspaces:
    - name: source

  steps:
    - name: scan
      image: docker.io/aquasec/trivy:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        trivy fs \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --no-progress \
          --exit-code 1 \
          .
