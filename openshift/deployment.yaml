apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management
  labels:
    app: order-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-management
  template:
    metadata:
      labels:
        app: order-management
    spec:
      containers:
        - name: order-management
          # Replace <namespace> with the actual OpenShift project name.
          image: image-registry.openshift-image-registry.svc:5000/order-app/order-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NOTIFICATION_SERVICE_URL
              # Short service name works when both apps are in the same namespace.
              # For cross-namespace access use
              # http://order-notification.<namespace>.svc.cluster.local:8081
              value: http://order-notification:8081
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
