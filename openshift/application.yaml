apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: order-management
  namespace: openshift-gitops

spec:
  project: default

  source:
    repoURL: https://github.com/cnkiddlin/order-app-gitops.git
    targetRevision: main
    path: order-management

  destination:
    server: https://kubernetes.default.svc
    namespace: order-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
