apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater

metadata:
  name: order-services
  namespace: openshift-gitops

spec:

  applicationRefs:

  - namePattern: "order-management"

    images:

    - alias: order-management

      imageName: image-registry.openshift-image-registry.svc:5000/order-app/order-management:latest

      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: "regexp:^[0-9a-f]{40}$"


  - namePattern: "order-notification"

    images:

    - alias: order-notification

      imageName: image-registry.openshift-image-registry.svc:5000/order-app/order-notification:latest

      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: "regexp:^[0-9a-f]{40}$"